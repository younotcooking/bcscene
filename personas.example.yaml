# Copy this file to personas.yaml and fill in your real account/project IDs.
# personas.yaml is gitignored — never commit it.
#
# Each persona maps to a basecamp profile (created via bcscene-setup-personas)
# and an OAuth identity in your demo Basecamp account.
#
# The full Enormicom roster is included below. Trim it down to just the
# personas you plan to use — every persona requires its own OAuth flow
# during setup, so fewer means faster setup.

account_id: "YOUR_ACCOUNT_ID"          # The Basecamp account these personas live in
default_project_id: "YOUR_PROJECT_ID"  # Optional: project most scenes use

# Optional: target a non-production Basecamp (local dev / staging). Leave this
# commented out to use production (the default). See "Targeting a local or
# staging Basecamp" in SETUP.md.
#
# The oauth_* values below are 37signals' launchpad "bcq" fixture client (a
# stock dev OAuth app for the Basecamp CLI) — use them as-is for local dev; no
# app registration needed. For staging or a non-fixture launchpad, register your
# own app (redirect URI http://127.0.0.1:8976/callback) and substitute its creds.
#
# target: local
# environments:
#   local:
#     base_url: "http://3.basecampapi.localhost:4001"   # API host (port 4001, NOT the app host on 3001)
#     launchpad_url: "http://launchpad.localhost:3011"  # local OAuth host
#     oauth_client_id: "bcq_dev_client_id_37signals_local"
#     oauth_client_secret: "bcq_dev_client_secret_37signals_local"

